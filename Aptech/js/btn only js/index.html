<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Events Practice</title>
</head>
<body>
    <button onclick="console.log('button was clicked');alert('hello!')">Click me</button>
    <button ondblclick="console.log('button was clicked 2x');alert('hello!')">Double-click me</button>
    <div onmouseover="console.log('you are inside div')">Hover over this box</div>

    <!-- script.js looks this button up by its id -->
    <button id="btn1">btn1</button>


    <script src="script.js"></script>
</body>
</html>
