<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Web App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f0fdf4);
            color: #1f2937;
        }

        .container {
            max-width: 560px;
            margin: auto;
            padding: 28px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
        }

        h1 {
            margin: 0 0 4px;
            font-size: 1.6rem;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 24px;
            text-align: center;
            color: #6b7280;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.2s;
        }

        button:hover {
            filter: brightness(0.92);
        }

        .add { background: #16a34a; }
        .edit { background: #2563eb; }
        .delete { background: #dc2626; }
        .cancel { background: #6b7280; }

        ul {
            list-style: none;
            padding: 0;
            margin: 24px 0 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: #f9fafb;
            border: 1px solid #eef0f3;
            border-radius: 10px;
        }

        li.editing {
            border-color: #6366f1;
            background: #eef2ff;
        }

        .item-text {
            overflow-wrap: anywhere;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .actions button {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .empty {
            margin-top: 24px;
            text-align: center;
            color: #9ca3af;
        }

        .error {
            min-height: 1.2em;
            margin: 8px 0 0;
            font-size: 0.85rem;
            color: #dc2626;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>📝 CRUD Web App</h1>
        <p class="subtitle">Create, read, update and delete items. Your list is saved in this browser.</p>

        <form id="itemForm">
            <input type="text" id="itemInput" placeholder="Enter an item" maxlength="120" aria-label="Item">
            <button type="submit" class="add" id="submitBtn">Add</button>
            <button type="button" class="cancel" id="cancelBtn" hidden>Cancel</button>
        </form>
        <p class="error" id="error" role="alert"></p>

        <ul id="itemList"></ul>
        <p class="empty" id="emptyState">No items yet. Add your first one above!</p>
    </main>

    <script>
        const STORAGE_KEY = "crud-items";
        const form = document.getElementById("itemForm");
        const input = document.getElementById("itemInput");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const list = document.getElementById("itemList");
        const emptyState = document.getElementById("emptyState");
        const error = document.getElementById("error");

        let items = loadItems();
        let editIndex = null;

        function loadItems() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveItems() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch {
                /* storage can be blocked (e.g. private mode); the app still works without it */
            }
        }

        // Create / Update
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const value = input.value.trim();

            if (value === "") {
                error.textContent = "Please enter something!";
                input.focus();
                return;
            }

            if (editIndex === null) {
                items.push(value);
            } else {
                items[editIndex] = value;
            }

            resetForm();
            saveItems();
            displayItems();
        });

        cancelBtn.addEventListener("click", () => {
            resetForm();
            displayItems();
        });

        function resetForm() {
            editIndex = null;
            input.value = "";
            error.textContent = "";
            submitBtn.textContent = "Add";
            submitBtn.className = "add";
            cancelBtn.hidden = true;
        }

        // Read
        // Items are added with textContent (not innerHTML), so typing HTML like <img onerror=...>
        // shows up as plain text instead of running as code.
        function displayItems() {
            list.replaceChildren();
            emptyState.hidden = items.length > 0;

            items.forEach((item, index) => {
                const li = document.createElement("li");
                li.classList.toggle("editing", index === editIndex);

                const text = document.createElement("span");
                text.className = "item-text";
                text.textContent = item;

                const actions = document.createElement("span");
                actions.className = "actions";
                actions.append(
                    makeButton("Edit", "edit", () => editItem(index)),
                    makeButton("Delete", "delete", () => deleteItem(index))
                );

                li.append(text, actions);
                list.append(li);
            });
        }

        function makeButton(label, className, onClick) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = className;
            button.textContent = label;
            button.addEventListener("click", onClick);
            return button;
        }

        // Update (step 1: load the item into the input box)
        function editItem(index) {
            editIndex = index;
            input.value = items[index];
            input.focus();
            submitBtn.textContent = "Update";
            submitBtn.className = "edit";
            cancelBtn.hidden = false;
            displayItems();
        }

        // Delete
        function deleteItem(index) {
            items.splice(index, 1);
            if (editIndex === index) {
                resetForm();
            } else if (editIndex !== null && editIndex > index) {
                editIndex--; // the item being edited moved up one place
            }
            saveItems();
            displayItems();
        }

        displayItems();
    </script>
</body>

</html>
