<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Rock <span>·</span> Paper <span>·</span> Scissors</h1>
        <p class="subtitle">Pick your move. Tip: you can also press R, P or S.</p>
    </header>

    <main>
        <section class="choices" aria-label="Your move">
            <button class="choice" id="rock" type="button">
                <img src="./images/rock.png" alt="" />
                <span>Rock</span>
            </button>
            <button class="choice" id="paper" type="button">
                <img src="./images/paper.png" alt="" />
                <span>Paper</span>
            </button>
            <button class="choice" id="scissors" type="button">
                <img src="./images/scissors.png" alt="" />
                <span>Scissors</span>
            </button>
        </section>

        <section class="score-board" aria-label="Score">
            <div class="score">
                <p id="user-score">0</p>
                <p class="label">You</p>
            </div>
            <div class="vs">VS</div>
            <div class="score">
                <p id="comp-score">0</p>
                <p class="label">Computer</p>
            </div>
        </section>

        <div class="msg-container">
            <p id="msg" role="status" aria-live="polite">Play your move</p>
        </div>

        <button id="reset" class="reset" type="button">↺ Reset score</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
