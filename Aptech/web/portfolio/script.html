<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: radial-gradient(circle at top, #1e293b, #020617);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .calculator {
      width: 100%;
      max-width: 320px;
      padding: 20px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    #result {
      width: 100%;
      height: 72px;
      margin-bottom: 16px;
      padding: 0 12px;
      font-size: 2rem;
      text-align: right;
      color: #f8fafc;
      background: transparent;
      border: none;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 1.3rem;
      color: #e2e8f0;
      background: #1e293b;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover {
      background: #334155;
    }

    button:active {
      transform: scale(0.95);
    }

    .fn {
      color: #38bdf8;
    }

    .op {
      color: #fff;
      background: #f59e0b;
    }

    .op:hover {
      background: #d97706;
    }

    .equal {
      grid-column: span 2;
      color: #fff;
      background: #22c55e;
    }

    .equal:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <input type="text" id="result" readonly aria-label="Result" placeholder="0">
    <div class="buttons">
      <button class="fn" onclick="clearResult()">C</button>
      <button class="fn" onclick="deleteChar()" aria-label="Delete">⌫</button>
      <button class="fn" onclick="append('%')">%</button>
      <button class="op" onclick="append('/')" aria-label="Divide">÷</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="op" onclick="append('*')" aria-label="Multiply">×</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button class="op" onclick="append('-')" aria-label="Subtract">−</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button class="op" onclick="append('+')" aria-label="Add">+</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("result");

    function append(value) {
      if (display.value === "Error") display.value = "";
      display.value += value;
    }

    function clearResult() {
      display.value = "";
    }

    function deleteChar() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      const expression = display.value.replace(/%/g, "/100");
      // Only digits, operators, dots and brackets are allowed, so no other code can run.
      if (!/^[\d+\-*/.() ]+$/.test(expression)) {
        if (expression) display.value = "Error";
        return;
      }
      try {
        const output = Function(`"use strict"; return (${expression});`)();
        display.value = Number.isFinite(output) ? String(+output.toFixed(10)) : "Error";
      } catch {
        display.value = "Error";
      }
    }

    // Keyboard support
    document.addEventListener("keydown", (event) => {
      if (/^[\d+\-*/.%]$/.test(event.key)) append(event.key);
      else if (event.key === "Enter" || event.key === "=") { event.preventDefault(); calculate(); }
      else if (event.key === "Backspace") deleteChar();
      else if (event.key === "Escape") clearResult();
    });
  </script>
</body>
</html>
